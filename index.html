<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Генератор схем приёма препаратов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F1;
    --ink:#23262B;
    --ink-soft:#5B6068;
    --paper:#FFFFFF;
    --line:#E7E2D8;
    --warn-soft:#FBEBD9;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:880px;margin:0 auto;padding:32px 22px 70px;}
  header{margin-bottom:22px;}
  .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:32px;line-height:1.15;margin:0 0 10px;}
  h3{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0 0 14px;}
  .lead{font-size:15.5px;color:var(--ink-soft);line-height:1.5;max-width:620px;}
  .notice{margin-top:16px;background:var(--warn-soft);border:1px solid #F0D7B3;border-radius:var(--radius);padding:14px 18px;font-size:13.5px;line-height:1.5;color:#7A4E16;display:flex;gap:10px;align-items:flex-start;}
  .notice svg{flex-shrink:0;margin-top:2px;}

  /* ---------- форма ---------- */
  .builder{background:var(--paper);border:1px dashed #CFC9BB;border-radius:24px;padding:22px 24px;margin-bottom:30px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .field{flex:1 1 180px;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field select{
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:'Inter',sans-serif;background:#FCFBF8;color:var(--ink);
  }
  .field input[type=color]{width:54px;height:38px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#FCFBF8;cursor:pointer;}
  .phase-box{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#FCFBF8;position:relative;}
  .phase-box .phase-num{position:absolute;top:-10px;left:14px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:100px;}
  .times-check{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;}
  .times-check label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink);text-transform:none;}
  .times-check input{width:16px;height:16px;}
  .maint-check{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px;}
  .maint-check input{width:16px;height:16px;}
  .ghost-btn, .solid-btn{border:none;border-radius:100px;padding:10px 18px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .ghost-btn{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .ghost-btn:hover{background:#F3F0E9;}
  .solid-btn{background:var(--ink);color:#fff;}
  .solid-btn:hover{opacity:.88;}
  .builder-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .remove-phase{position:absolute;top:8px;right:10px;background:none;border:none;color:#B23B3B;cursor:pointer;font-size:12px;font-weight:600;}

  /* ---------- карточки результата ---------- */
  .card{background:var(--paper);border-radius:20px;border:1px solid var(--line);margin-top:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,15,.03);position:relative;}
  .card-head{display:flex;align-items:center;gap:14px;padding:16px 20px 12px;}
  .icon-box{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#FCFBF8;border:1px solid var(--line);}
  .icon-box svg{width:42px;height:42px;}
  .card-title h2{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0 0 2px;}
  .card-title .sub{font-size:12px;color:var(--ink-soft);}
  .pill-tag{margin-left:auto;font-size:11px;font-weight:600;padding:5px 11px;border-radius:100px;letter-spacing:.02em;white-space:nowrap;}
  .delete-card{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:11px;}
  .delete-card:hover{color:#B23B3B;}

  .steps{display:flex;align-items:stretch;gap:0;padding:0 20px 12px;overflow-x:auto;}
  .step{flex:1 1 0;min-width:104px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px 9px;position:relative;background:#FCFBF8;}
  .step .day-tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);}
  .step .date-sub{font-size:10px;color:var(--ink-soft);opacity:.8;margin-top:1px;}
  .step .dose{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:4px 0 1px;line-height:1;}
  .step .dose small{font-size:11px;font-weight:500;color:var(--ink-soft);}
  .step .detail{font-size:10.5px;color:var(--ink-soft);line-height:1.3;}
  .arrow{flex:0 0 20px;display:flex;align-items:center;justify-content:center;}

  table.tracker{width:100%;border-collapse:collapse;margin:0;table-layout:fixed;}
  table.tracker th,table.tracker td{border-top:1px solid var(--line);padding:6px 8px;text-align:center;font-size:12.5px;height:30px;}
  table.tracker th{background:#F7F4ED;color:var(--ink-soft);font-weight:600;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;}
  table.tracker td:first-child, table.tracker th:first-child{text-align:left;padding-left:18px;font-weight:600;color:var(--ink);width:34%;}
  .day-date{font-weight:400;color:var(--ink-soft);font-size:11px;margin-left:4px;}
  tr.phase-divider td{background:#F7F4ED;font-size:11px;font-weight:700;color:var(--ink-soft);text-align:left;padding-left:18px;height:24px;letter-spacing:.02em;}
  td.cell-empty{background:repeating-linear-gradient(135deg, transparent, transparent 5px, #F1EEE6 5px, #F1EEE6 6px);}
  .tracker-wrap{padding:0 20px 16px;}
  input[type=checkbox].dose-check{width:17px;height:17px;cursor:pointer;}

  .footer-note{margin-top:22px;font-size:11.5px;color:var(--ink-soft);text-align:center;}
  .print-btn{margin-top:22px;display:flex;justify-content:center;}

  @media print{
    @page{ size: A4; margin: 9mm 11mm; }
    body{background:#fff;}
    .print-btn, .builder, .delete-card{display:none !important;}
    .eyebrow, .lead{display:none;}
    .wrap{max-width:100%;padding:0;}
    header{margin-bottom:8px;}
    h1{font-size:19px;margin:0 0 4px;}
    .notice{padding:8px 12px;font-size:10.5px;margin-top:0;border-radius:8px;}
    .notice svg{width:14px;height:14px;}

    .card{box-shadow:none;border:1px solid #d8d4c9;border-radius:10px;margin-top:9px;break-inside:avoid;}
    .card-head{padding:10px 14px 8px;gap:9px;}
    .icon-box{width:38px;height:38px;border-radius:8px;}
    .icon-box svg{width:30px;height:30px;}
    .card-title h2{font-size:13.5px;margin:0 0 1px;}
    .card-title .sub{font-size:9.5px;}
    .pill-tag{font-size:8.5px;padding:3px 8px;}

    .steps{padding:0 14px 8px;gap:5px;}
    .step{min-width:0;padding:6px 7px 7px;border-radius:8px;}
    .step .day-tag{font-size:8.5px;}
    .step .date-sub{font-size:8px;}
    .step .dose{font-size:14px;}
    .step .detail{font-size:8.5px;}
    .arrow svg{width:12px;height:8px;}

    .tracker-wrap{padding:0 14px 10px;}
    table.tracker th, table.tracker td{padding:3px 6px;font-size:9px;height:19px;}
    table.tracker td:first-child, table.tracker th:first-child{padding-left:12px;}
    tr.phase-divider td{height:16px;font-size:9px;padding-left:12px;}
    input[type=checkbox].dose-check{width:11px;height:11px;}
    .footer-note{font-size:8px;margin-top:6px;}
  }
  @media (max-width:600px){
    .steps{flex-direction:column;}
    .arrow{transform:rotate(90deg);height:18px;}
    .card-head{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Конструктор памяток</div>
    <p class="lead">Заполните параметры препарата и этапы повышения дозы — карточка с иконкой, схемой со стрелками и единым чек-листом приёма сформируется автоматически.</p>
  </header>

  <div class="builder">
    <h3>Новый препарат</h3>
    <div class="row">
      <div class="field" style="flex:2 1 220px">
        <label>Название (МНН)</label>
        <input type="text" id="f-name" placeholder="напр. Оланзапин">
      </div>
      <div class="field" style="flex:2 1 220px">
        <label>Торговое название</label>
        <input type="text" id="f-sub" placeholder="напр. торговое название «Заласта»">
      </div>
      <div class="field" style="flex:0 0 150px">
        <label>Форма</label>
        <select id="f-shape">
          <option value="tablet-round">Таблетка круглая</option>
          <option value="tablet-oval">Таблетка овальная</option>
          <option value="capsule">Капсула</option>
        </select>
      </div>
      <div class="field" style="flex:0 0 70px">
        <label>Цвет</label>
        <input type="color" id="f-color" value="#5B6FE0">
      </div>
      <div class="field" style="flex:0 0 160px">
        <label>Дата начала приёма</label>
        <input type="date" id="f-startdate">
      </div>
      <div class="field" style="flex:0 0 130px">
        <label>Уже принято доз</label>
        <input type="number" id="f-taken" min="0" value="0">
      </div>
    </div>

    <h3 style="margin-top:18px">Этапы дозирования</h3>
    <div id="phases-holder"></div>
    <div class="builder-actions">
      <button class="ghost-btn" onclick="addPhaseRow()">+ Добавить этап</button>
    </div>

    <div class="builder-actions" style="margin-top:20px;border-top:1px solid var(--line);padding-top:16px;">
      <button class="solid-btn" onclick="generateCard()">Сформировать карточку</button>
      <button class="ghost-btn" onclick="resetForm()">Очистить форму</button>
    </div>
  </div>

  <div id="cards"></div>

  <div class="print-btn"><button class="solid-btn" onclick="window.print()">Распечатать памятку</button></div>
  <div class="footer-note">Сформировано автоматически по назначению врача</div>
</div>

<script>
let phaseCount = 0;
const MONTHS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function fmtDate(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtRange(a, b){
  if(a.getTime() === b.getTime()) return fmtDate(a);
  if(a.getMonth() === b.getMonth()) return a.getDate() + '–' + b.getDate() + ' ' + MONTHS[a.getMonth()];
  return fmtDate(a) + ' – ' + fmtDate(b);
}
function todayISO(){ const d = new Date(); return isoLocal(d); }
function isoLocal(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isoOffset(n){ return isoLocal(addDays(new Date(), n)); }

function addPhaseRow(prefill){
  phaseCount++;
  const id = phaseCount;
  const holder = document.getElementById("phases-holder");
  const box = document.createElement("div");
  box.className = "phase-box";
  box.id = "phase-" + id;
  box.innerHTML = `
    <span class="phase-num">Этап ${id}</span>
    <button class="remove-phase" onclick="document.getElementById('phase-${id}').remove()">Удалить</button>
    <div class="row" style="margin-bottom:8px">
      <div class="field" style="flex:1 1 140px">
        <label>Дни (подпись)</label>
        <input type="text" class="p-day" placeholder="напр. 1–3 день" value="${prefill && prefill.day || ''}">
      </div>
      <div class="field" style="flex:0 0 100px">
        <label>Доза</label>
        <input type="text" class="p-dose" placeholder="напр. 5" value="${prefill && prefill.dose || ''}">
      </div>
      <div class="field" style="flex:0 0 120px">
        <label>Единица</label>
        <input type="text" class="p-unit" placeholder="мг/сут" value="${prefill && prefill.unit || 'мг/сут'}">
      </div>
      <div class="field" style="flex:0 0 90px">
        <label>Дней в этапе</label>
        <input type="number" class="p-days-count" min="1" value="${prefill && prefill.days || 3}">
      </div>
    </div>
    <div class="field" style="margin-bottom:8px">
      <label>Описание приёма</label>
      <input type="text" class="p-detail" placeholder="напр. 300 утром + 300 в обед" value="${prefill && prefill.detail || ''}">
    </div>
    <div class="field">
      <label>Время приёма (для чек-листа)</label>
      <div class="times-check">
        <label><input type="checkbox" class="p-time" value="Утро" ${prefill && prefill.times && prefill.times.includes('Утро') ? 'checked':''}> Утро</label>
        <label><input type="checkbox" class="p-time" value="Обед" ${prefill && prefill.times && prefill.times.includes('Обед') ? 'checked':''}> Обед</label>
        <label><input type="checkbox" class="p-time" value="Вечер" ${prefill && prefill.times && prefill.times.includes('Вечер') ? 'checked':''}> Вечер</label>
      </div>
    </div>
    <label class="maint-check"><input type="checkbox" class="p-maint" ${prefill && prefill.maintenance ? 'checked':''}> Это поддерживающая доза (далее без ограничения по дням)</label>
  `;
  holder.appendChild(box);
}

function resetForm(){
  document.getElementById("f-name").value = "";
  document.getElementById("f-sub").value = "";
  document.getElementById("f-shape").value = "tablet-round";
  document.getElementById("f-color").value = "#5B6FE0";
  document.getElementById("f-startdate").value = "";
  document.getElementById("f-taken").value = "0";
  document.getElementById("phases-holder").innerHTML = "";
  phaseCount = 0;
  addPhaseRow();
}

function lighten(hex, pct){
  hex = hex.replace('#','');
  const r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  const nr = Math.round(r + (255-r)*pct), ng = Math.round(g + (255-g)*pct), nb = Math.round(b + (255-b)*pct);
  return `rgb(${nr},${ng},${nb})`;
}
function darken(hex, pct){
  hex = hex.replace('#','');
  const r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  const nr = Math.round(r*(1-pct)), ng = Math.round(g*(1-pct)), nb = Math.round(b*(1-pct));
  return `rgb(${nr},${ng},${nb})`;
}

function icon(type, color){
  if(type === "tablet-round"){
    return `<svg width="56" height="56" viewBox="0 0 56 56" fill="none">
      <rect x="4" y="4" width="48" height="48" rx="10" fill="#fff" stroke="${color}" stroke-width="1.4" opacity="0.9"/>
      <g opacity="0.55">
        <circle cx="16" cy="16" r="6" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
        <circle cx="40" cy="16" r="6" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
        <circle cx="16" cy="40" r="6" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
      </g>
      <circle cx="40" cy="40" r="9" fill="#F5F4F1" stroke="#D8D5CC" stroke-width="1"/>
      <ellipse cx="37.5" cy="37" rx="3" ry="2" fill="#fff" opacity="0.8"/>
      <path d="M34 40h12" stroke="#C9C6BD" stroke-width="0.9"/>
    </svg>`;
  }
  if(type === "capsule"){
    return `<svg width="56" height="56" viewBox="0 0 56 56" fill="none">
      <rect x="4" y="4" width="48" height="48" rx="10" fill="#fff" stroke="${color}" stroke-width="1.4" opacity="0.9"/>
      <g opacity="0.5">
        <rect x="11" y="13" width="11" height="5.5" rx="2.75" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
        <rect x="34" y="13" width="11" height="5.5" rx="2.75" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
      </g>
      <rect x="31" y="32" width="17" height="9" rx="4.5" fill="#fff" stroke="#D8D5CC" stroke-width="1"/>
      <rect x="31" y="32" width="8.5" height="9" rx="4.5" fill="${lighten(color,0.55)}" stroke="#D8D5CC" stroke-width="1"/>
    </svg>`;
  }
  return `<svg width="56" height="56" viewBox="0 0 56 56" fill="none">
    <rect x="4" y="4" width="48" height="48" rx="10" fill="#fff" stroke="${color}" stroke-width="1.4" opacity="0.9"/>
    <g opacity="0.55">
      <rect x="11" y="13" width="11" height="5.5" rx="2.75" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
      <rect x="34" y="13" width="11" height="5.5" rx="2.75" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
      <rect x="11" y="36" width="11" height="5.5" rx="2.75" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
    <rect x="31" y="34.5" width="15" height="7" rx="3.5" fill="#F5F4F1" stroke="#D8D5CC" stroke-width="1"/>
    <line x1="38.5" y1="34.5" x2="38.5" y2="41.5" stroke="#D8D5CC" stroke-width="0.8"/>
  </svg>`;
}

const TIME_PRIORITY = ['Утро','Обед','Вечер','Приём'];

function buildCard(med){
  const c = document.createElement("div");
  c.className = "card";
  const accent = med.color;
  const soft = lighten(accent, 0.86);
  const dark = darken(accent, 0.12);
  const startDate = med.startDate ? new Date(med.startDate + "T00:00:00") : new Date();

  /* канонический набор колонок времени для всего препарата */
  const timesSet = new Set();
  med.phases.forEach(p => p.times.forEach(t => timesSet.add(t)));
  let times = TIME_PRIORITY.filter(t => timesSet.has(t));
  timesSet.forEach(t => { if(!times.includes(t)) times.push(t); });
  if(times.length === 0) times = ["Приём"];

  /* шаги-схема со стрелками + диапазон дат на каждом этапе */
  let cumDays = 0;
  let stepsHtml = "";
  med.steps.forEach((s, i) => {
    const phaseDays = (med.phases[i] && med.phases[i].days) || 1;
    const rangeStart = addDays(startDate, cumDays);
    const rangeEnd = addDays(startDate, cumDays + phaseDays - 1);
    const dateLabel = fmtRange(rangeStart, rangeEnd);
    cumDays += phaseDays;

    stepsHtml += `<div class="step" style="${s.maintenance ? `border-color:${accent};background:${soft};` : ""}">
        <div class="day-tag">${s.day}</div>
        <div class="date-sub">${dateLabel}</div>
        <div class="dose">${s.dose}<small> ${s.unit}</small></div>
        <div class="detail">${s.detail}</div>
      </div>`;
    if(i < med.steps.length - 1){
      stepsHtml += `<div class="arrow" style="color:${dark}"><svg width="20" height="12" viewBox="0 0 20 12" fill="none"><path d="M1 6h16M12 1l6 5-6 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
    }
  });

  /* единая таблица-трекер на весь препарат: одинаковые колонки/строки во всех этапах */
  let cum2 = 0;
  let doseCounter = 0;
  const takenCount = med.takenCount || 0;
  let rowsHtml = "";
  med.phases.forEach((p) => {
    rowsHtml += `<tr class="phase-divider"><td colspan="${times.length + 1}">${p.label}${p.maintenance ? " · далее по этой же схеме" : ""}</td></tr>`;
    for(let d = 1; d <= p.days; d++){
      const date = addDays(startDate, cum2);
      cum2++;
      const cells = times.map(t => {
        if(p.times.includes(t)){
          doseCounter++;
          const checked = doseCounter <= takenCount ? "checked" : "";
          return `<td><input type="checkbox" class="dose-check" ${checked} style="accent-color:${dark}"></td>`;
        }
        return `<td class="cell-empty"></td>`;
      }).join("");
      rowsHtml += `<tr><td>День ${d}<span class="day-date">${fmtDate(date)}</span></td>${cells}</tr>`;
    }
  });
  const headerCells = times.map(t => `<th>${t}</th>`).join("");
  const tableHtml = `<div class="tracker-wrap">
      <table class="tracker">
        <thead><tr><th>&nbsp;</th>${headerCells}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;

  c.innerHTML = `
    <button class="delete-card" onclick="this.closest('.card').remove()">✕ Удалить</button>
    <div class="card-head">
      <div class="icon-box">${icon(med.icon, dark)}</div>
      <div class="card-title">
        <h2>${med.name}</h2>
        <div class="sub">${med.sub}</div>
      </div>
      <div class="pill-tag" style="background:${soft};color:${dark}">по схеме</div>
    </div>
    <div class="steps">${stepsHtml}</div>
    ${tableHtml}
  `;
  return c;
}

function generateCard(){
  const name = document.getElementById("f-name").value.trim();
  const sub = document.getElementById("f-sub").value.trim();
  const shape = document.getElementById("f-shape").value;
  const color = document.getElementById("f-color").value;
  const startdate = document.getElementById("f-startdate").value || todayISO();
  const taken = parseInt(document.getElementById("f-taken").value) || 0;

  if(!name){
    alert("Укажите название препарата");
    return;
  }

  const phaseBoxes = document.querySelectorAll("#phases-holder .phase-box");
  if(phaseBoxes.length === 0){
    alert("Добавьте хотя бы один этап дозирования");
    return;
  }

  const steps = [];
  const phases = [];

  phaseBoxes.forEach(box => {
    const day = box.querySelector(".p-day").value.trim() || "—";
    const dose = box.querySelector(".p-dose").value.trim() || "—";
    const unit = box.querySelector(".p-unit").value.trim() || "";
    const detail = box.querySelector(".p-detail").value.trim() || "";
    const daysCount = parseInt(box.querySelector(".p-days-count").value) || 1;
    const maintenance = box.querySelector(".p-maint").checked;
    const timeChecks = Array.from(box.querySelectorAll(".p-time:checked")).map(i => i.value);
    const times = timeChecks.length ? timeChecks : ["Приём"];

    steps.push({ day, dose, unit, detail, maintenance });
    phases.push({
      label: `${dose} ${unit} · ${maintenance ? "далее" : daysCount + " дня"}`,
      days: maintenance ? Math.max(daysCount, 7) : daysCount,
      times,
      maintenance
    });
  });

  const med = { name, sub: sub || "схема приёма", icon: shape, color, startDate: startdate, takenCount: taken, steps, phases };

  document.getElementById("cards").appendChild(buildCard(med));
  resetForm();
  document.getElementById("cards").lastElementChild.scrollIntoView({behavior:"smooth", block:"center"});
}
